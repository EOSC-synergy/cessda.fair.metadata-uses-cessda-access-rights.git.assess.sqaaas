      github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.bluesy-bronze-dollar.sh
        container: qc.sty_sickly-aqua-opossum
      github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.homely-zucchini-bison.sh
        container: qc.sty_randy-buff-zonkey
