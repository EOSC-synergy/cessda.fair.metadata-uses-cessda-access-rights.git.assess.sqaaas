config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights:
      branch: main
      repo: https://github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights git:
        commands:
        - /usr/bin/env sh .sqa/script.bumpy-amber-sloth.sh
        container: qc.acc_breezy-buff-lemur
  QC.Doc:
    repos:
      github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-lavender-gibbon.sh
        container: qc.doc_squeaky-sapphire-hare
      github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights git:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-amethyst-leopard.sh
        container: qc.doc_muzzy-auburn-rat
      github.com/cessda/cessda.fair.metadata-uses-cessda-access-rights markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-wheat-dog.sh
        container: qc.doc_lanky-ochre-tarantula
